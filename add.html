<!doctype html>
<html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101a2c"><title>Nova transação · Quantova</title><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"></head>
<body><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">Q</span><span>quantova<small>FINANÇAS PESSOAIS</small></span></a><a class="nav-link back-link" href="./index.html">← <span>Voltar ao resumo</span></a></header>
<main class="form-shell"><div class="form-intro"><p class="eyebrow">REGISTO RÁPIDO</p><h1 id="formTitle">Nova transação</h1><p class="muted">Guarda cada movimento para manter as tuas contas em dia.</p></div>
<section class="form-panel"><form id="formAdd"><label class="field-label">Tipo de transação</label><input type="hidden" id="tipo" value="despesa"><div class="segmented"><button type="button" id="btnDespesa" class="segment active expense-active" aria-pressed="true" onclick="setTipo('despesa')"><span>−</span> Despesa</button><button type="button" id="btnReceita" class="segment" aria-pressed="false" onclick="setTipo('receita')"><span>+</span> Receita</button></div>
<label for="valor" class="field-label">Valor</label><div class="amount-wrap"><span id="amountSign" class="amount-sign expense-sign" aria-hidden="true">−</span><span id="currencyPrefix">€</span><input type="number" id="valor" inputmode="decimal" class="amount-input" placeholder="0,00" min="0.01" step="0.01" required></div>
<div class="form-row"><div><label for="categoria" class="field-label">Categoria</label><select id="categoria" class="field" required></select></div><div><label for="data" class="field-label">Data</label><input type="date" id="data" class="field" required></div></div>
<label for="descricao" class="field-label">Descrição <span class="optional">· opcional</span></label><input type="text" id="descricao" class="field" maxlength="120" placeholder="Ex.: compras da semana">
<p id="formError" class="form-error" role="alert" hidden></p><div class="form-actions"><button type="button" class="button button-soft" onclick="window.location.href='historico.html'">Cancelar</button><button type="submit" class="button button-primary" id="submitButton">Guardar transação</button></div></form></section></main>
<script src="./db-local.js"></script><script src="./settings.js"></script><script src="./add.js"></script></body></html>
